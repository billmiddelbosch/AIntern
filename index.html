          "name": "Wat betekent no-cure-no-pay precies?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Je betaalt alleen als de AI-oplossing aantoonbaar resultaat oplevert. Wij definiëren samen met jou vooraf meetbare doelen — zoals tijdsbesparing, kostenverlaging of verhoogde output. Halen we die doelen niet? Dan betaal je niets."

          "@type": "Question",

            "@type": "Answer",

          }
        },
        {
          "@type": "Question",
          "name": "Moet ik technische kennis hebben?",
          "acceptedAnswer": {
            "@type": "Answer",

        },

          "@type": "Question",
          "name": "Wat als de AI-oplossing niet werkt voor mijn bedrijf?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We beginnen altijd met een gratis analyse van jouw processen. Als we zien dat AI geen significante winst oplevert voor jouw specifieke situatie, zeggen we dat eerlijk — zodat je geen tijd en geld verspilt."
          }
        },

          "@type": "Question",

            "text": "De vergoeding is gebaseerd op een percentage van de behaalde besparing of een vaste fee die we samen bepalen op basis van de scope. Je betaalt pas als de resultaten zijn gemeten en geverifieerd."

        }
